name: 临时个性化浏览器验收
on:
  pull_request:
    paths:
      - index.html
      - .github/workflows/personal-preview.yml
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real-browser personalization scenarios
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null
          python3 -m http.server 8765 >/tmp/personal-http.log 2>&1 &
          sleep 2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          js="""
          <script>
          (() => {
            const delay = ms => new Promise(resolve=>setTimeout(resolve,ms));
            const cnt = () => Number(document.getElementById('cnt').textContent);
            const tests=[];
            const check = (truth,label) => tests.push([Boolean(truth),label]);
            window.addEventListener('load',async()=>{
              try {
                for(let i=0;i<90;i++){if(cnt()>0)break;await delay(100);}
                const total=Number(document.getElementById('tot').textContent);
                check(total>=650 && cnt()===total,'default full corpus');
                check(document.getElementById('personal-mode-switch').hidden,'default modes hidden');
                check(!localStorage.getItem('howtolivebetter:personal:v1'),'default no profile storage');
                const originalHidden=JSON.stringify(JSON.parse(localStorage.getItem('howtolivebetter:hidden-items:v1')||'[]'));
                document.getElementById('personal-trigger').click();
                check(document.getElementById('personal-panel').classList.contains('open'),'panel opens');
                document.getElementById('person-sex').value='male';
                document.getElementById('person-age').value='18-24';
                document.getElementById('personal-save').click();
                check(cnt()===total,'saving profile does not filter');
                check(!document.getElementById('personal-mode-switch').hidden,'mode toggles now visible');
                document.querySelector('[data-person-mode="my"]').click();
                const personalTotal=cnt();
                check(personalTotal<total && personalTotal>500,'personal mode filters conservatively');
                check(document.getElementById('sec-27').hidden,'pregnancy chapter suppressed in my mode');
                const first=[...document.querySelectorAll('.card')].find(c=>!c.hidden);
                first.querySelector('[data-person-rule="skip"]').click();
                check(cnt()===personalTotal-1,'per-item skip operates in personal mode');
                document.querySelector('[data-person-mode="all"]').click();
                check(cnt()===total,'all mode restores automatically filtered and skipped items');
                first.querySelector('.hide-item').click();
                check(cnt()===total-1 && document.getElementById('hidden-count').textContent==='1','old hide works');
                document.querySelector('#hidden-list .restore-item').click();
                check(cnt()===total,'old restore works');
                check(JSON.stringify(JSON.parse(localStorage.getItem('howtolivebetter:hidden-items:v1')||'[]'))===originalHidden,'old hide unchanged');
                document.getElementById('personal-trigger').click();
                check(!document.getElementById('personal-exceptions').hidden,'overrides manageable');
                document.querySelector('#personal-exceptions-list button').click();
                check(document.getElementById('personal-exceptions').hidden,'override reset');
                const settings=JSON.parse(localStorage.getItem('howtolivebetter:personal:v1'));
                check(settings.configured&&settings.mode==='all'&&settings.sex==='male'&&settings.age==='18-24','persisted correct profile and mode');
                window.confirm=()=>true;
                document.getElementById('personal-clear').click();
                check(cnt()===total&&!localStorage.getItem('howtolivebetter:personal:v1'),'clear preferences restores original browsing');
                check(document.getElementById('personal-mode-switch').hidden,'mode toggle re-hidden when unset');
                document.documentElement.dataset.personalQa=tests.every(x=>x[0])?'PASS':'FAIL';
                document.documentElement.dataset.personalQaDetails=tests.filter(x=>!x[0]).map(x=>x[1]).join(',');
              } catch(err){
                document.documentElement.dataset.personalQa='ERROR';
                document.documentElement.dataset.personalQaDetails=String(err.message||err);
              }
            });
          })();
          </script>
          """
          p.write_text(s.replace('</body>',js+'</body>'))
          PY
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=30000 --window-size=1440,900 --dump-dom http://127.0.0.1:8765/ >/tmp/personal-test-dom.txt 2>/tmp/chrome-errors.txt
          grep -o 'data-personal-qa="[^"]*"' /tmp/personal-test-dom.txt || true
          grep -o 'data-personal-qa-details="[^"]*"' /tmp/personal-test-dom.txt || true
          grep -q 'data-personal-qa="PASS"' /tmp/personal-test-dom.txt
          echo "PERSONAL_BROWSER_PASS"
