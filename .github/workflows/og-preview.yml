name: 临时增强版封面生成
on:
  pull_request:
    paths:
      - tools/og.html
      - .github/workflows/og-preview.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Rebuild 1200x630 preview
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=10000 --screenshot=og.png "file://${GITHUB_WORKSPACE}/tools/og.html" > /tmp/og-build.log 2>&1
          file og.png
          test -s og.png
          file og.png | grep -q 'PNG image data, 1200 x 630'
          git add og.png
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh social image for independent reading edition"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
          echo OG_IMAGE_PASS
