name: 临时隐藏目录浏览器验收
on:
  pull_request:
    paths:
      - index.html
      - .github/workflows/hidden-tree-preview.yml
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hierarchical hidden-item manager in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null
          python3 -m http.server 8765 >/tmp/hidden-http.log 2>&1 &
          sleep 2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          source=p.read_text()
          script="""
          <script>
          window.addEventListener('load',async()=>{
            const delay=ms=>new Promise(r=>setTimeout(r,ms)),checks=[];
            const ck=(value,why)=>checks.push([!!value,why]);
            const loaded=()=>Number(document.getElementById('tot')?.textContent)>600;
            for(let i=0;i<100&&!loaded();i++)await delay(100);
            const cards=sec=>CARDS.filter(c=>String(c.e.sec)===String(sec));
            if(location.search.includes('preview')){
              HIDDEN.add(cards(1)[0].hiddenKey);HIDDEN.add(cards(1)[1].hiddenKey);
              HIDDEN.add(cards(15)[0].hiddenKey);HIDDEN_SECTIONS.add('15');
              saveHidden();saveHiddenSections();renderHiddenPanel();apply();
              document.getElementById('hidden-nav').click();
              const toggle=document.querySelector('.hidden-chapter-toggle[data-sec="15"]');
              toggle?.click();
              document.documentElement.dataset.previewReady='YES';
              return;
            }
            try{
              ck(loaded(),'source corpus loaded');
              ck(!document.querySelector('#hidden-list'),'old flat individual list removed');
              const countBefore=Number(document.getElementById('cnt').textContent);
              ck(countBefore>600,'default content unaffected');
              ck(!HIDDEN.size&&!HIDDEN_SECTIONS.size,'no unexpected hidden');
              const one=cards(1),fifteen=cards(15),thirty=cards(30);
              ck(one.length>=3&&fifteen.length>=4&&thirty.length>=4,'sample chapter contents exist');
              HIDDEN.add(one[0].hiddenKey);HIDDEN.add(one[1].hiddenKey);
              HIDDEN.add(fifteen[0].hiddenKey);HIDDEN.add(thirty[0].hiddenKey);
              HIDDEN_SECTIONS.add('15');
              saveHidden();saveHiddenSections();renderHiddenPanel();apply();
              document.getElementById('hidden-nav').click();
              const root=document.getElementById('hidden-section-list');
              const toggles=[...root.querySelectorAll('.hidden-chapter-toggle')];
              ck(toggles.length===3&&toggles.map(x=>x.dataset.sec).join(',')==='1,15,30','unique chapters sorted and grouped');
              ck(document.getElementById('hidden-chapter-count').textContent==='1'&&
                 document.getElementById('hidden-count').textContent==='4','existing counters unaffected');
              ck(!root.querySelector('.hidden-row')&&!document.querySelector('main .hidden-chapter-directory'),'no flat content or main-space consumption');
              const sec1=root.querySelector('.hidden-chapter-toggle[data-sec="1"]');
              sec1.click();
              const entries1=root.querySelector('#hidden-chapter-items-1');
              ck(!entries1.hidden&&entries1.querySelectorAll('.hidden-entry-row').length===2,'partial chapter expands to only hidden items');
              const first=entries1.querySelector('.hidden-entry-detail');
              first.open=true;
              ck(first.querySelector('.hidden-entry-preview').textContent.length>30,'hidden item content preview without restore');
              ck(HIDDEN.has(one[0].hiddenKey),'preview does not unhide item');
              entries1.querySelector('.restore-item').click();
              ck(HIDDEN.size===3&&!root.querySelector('#hidden-chapter-items-1').hidden&&
                 root.querySelectorAll('#hidden-chapter-items-1 .hidden-entry-row').length===1,
                 'single restore keeps chapter expanded and remaining item');
              const sec15=root.querySelector('.hidden-chapter-toggle[data-sec="15"]');
              sec15.click();
              const sectionItems=root.querySelector('#hidden-chapter-items-15');
              ck(sectionItems.querySelectorAll('.hidden-entry-row').length===fifteen.length,
                 'entire hidden chapter expands to all original entries');
              ck(sectionItems.querySelectorAll('.hidden-entry-own-flag').length===1,
                 'individual hide within whole chapter distinguished');
              sectionItems.querySelector('.hidden-entry-detail').open=true;
              ck(HIDDEN_SECTIONS.has('15'),'preview keeps chapter hidden');
              root.querySelector('.restore-section[data-sec="15"]').click();
              const afterRestore=root.querySelector('.hidden-chapter-toggle[data-sec="15"]');
              ck(!HIDDEN_SECTIONS.has('15')&&HIDDEN.has(fifteen[0].hiddenKey),
                 'restoring full chapter preserves separately hidden entry');
              ck(afterRestore&&afterRestore.getAttribute('aria-expanded')==='true'&&
                 root.querySelectorAll('#hidden-chapter-items-15 .hidden-entry-row').length===1,
                 'restored section remains open with just separately hidden entry');
              root.querySelector('.restore-section[data-sec="15"]').click();
              ck(!HIDDEN.has(fifteen[0].hiddenKey)&&!root.querySelector('.hidden-chapter-toggle[data-sec="15"]'),
                 'restore chapter items removes individual hidden entries');
              root.querySelector('.restore-section[data-sec="1"]').click();
              root.querySelector('.restore-section[data-sec="30"]').click();
              ck(HIDDEN.size===0&&HIDDEN_SECTIONS.size===0&&root.querySelector('.hidden-empty'),
                 'all restored and empty state shown');
              ck(Number(document.getElementById('cnt').textContent)===countBefore,
                 'complete corpus returns after restore');
              document.getElementById('hidden-done').click();
              ck(!document.getElementById('hidden-manage').classList.contains('open'),'drawer can close');
              document.documentElement.dataset.hiddenTreeQa=checks.every(x=>x[0])?'PASS':'FAIL';
              document.documentElement.dataset.hiddenTreeDetails=checks.filter(x=>!x[0]).map(x=>x[1]).join(';');
            }catch(err){
              document.documentElement.dataset.hiddenTreeQa='ERROR';
              document.documentElement.dataset.hiddenTreeDetails=String(err.stack||err);
            }
          });
          </script>
          """
          p.write_text(source.replace('</body>',script+'</body>'))
          PY
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=30000 --dump-dom "http://127.0.0.1:8765/" > /tmp/hidden-tree-qa-dom.txt 2>/tmp/hidden-tree-qa-error.txt
          grep -o 'data-hidden-tree-qa="[^"]*"' /tmp/hidden-tree-qa-dom.txt || true
          grep -o 'data-hidden-tree-details="[^"]*"' /tmp/hidden-tree-qa-dom.txt || true
          grep -q 'data-hidden-tree-qa="PASS"' /tmp/hidden-tree-qa-dom.txt
          echo "HIDDEN_TREE_BROWSER_PASS"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=15000 --screenshot=/tmp/hidden-desktop.png "http://127.0.0.1:8765/?preview=1" >/dev/null 2>&1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=15000 --screenshot=/tmp/hidden-mobile.png "http://127.0.0.1:8765/?preview=1" >/dev/null 2>&1
          echo HIDDEN_DESKTOP_IMAGE_BEGIN
          base64 -w0 /tmp/hidden-desktop.png
          echo
          echo HIDDEN_DESKTOP_IMAGE_END
          echo HIDDEN_MOBILE_IMAGE_BEGIN
          base64 -w0 /tmp/hidden-mobile.png
          echo
          echo HIDDEN_MOBILE_IMAGE_END
