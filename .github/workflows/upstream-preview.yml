name: 临时真实上游同步验收
on:
  pull_request:
    paths:
      - tools/sync-upstream-content.mjs
      - tools/lib/entry-changes.mjs
      - .github/workflows/upstream-preview.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read live upstream and validate generated changes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/eternity4719/HowToLiveBetter.git "$RUNNER_TEMP/upstream"
          node --check tools/sync-upstream-content.mjs
          node tools/sync-upstream-content.mjs "$RUNNER_TEMP/upstream"
          node tools/check-site.mjs
          node tools/check-personal.mjs
          node tools/check-ui-features.mjs
          node -e "const a=require('./data/new-entries.json');const count=a.entries.length;if(!count)throw Error('new entries did not appear');console.log('REAL_UPSTREAM_SYNC_PASS: recently added entries',count);"
