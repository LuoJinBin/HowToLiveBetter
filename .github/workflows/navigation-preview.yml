name: 临时阅读导航真实浏览器验收
on:
  pull_request:
    paths:
      - index.html
      - .github/workflows/navigation-preview.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test navigation and hidden drawer on Chrome
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          sleep 2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          qa="""
          <script>
          window.addEventListener('load',async()=>{
            const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            const checks=[];
            const ck=(value,label)=>checks.push([!!value,label]);
            const number=()=>Number(document.getElementById('cnt').textContent);
            try {
              for(let i=0;i<120;i++){if(number()>650)break;await wait(100);}
              const total=number();
              ck(total>650,'all chapters display by default');
              ck(!document.querySelector('main #hidden-manage'),'hidden list not on homepage');
              const selected=document.querySelector('#f-sec>.sec-link[data-v="33"]');
              ck(!!selected,'chapter 33 exists');
              selected.click();
              await wait(750);
              const block=document.getElementById('sec-33');
              const top=block.getBoundingClientRect().top;
              ck(number()===20,'chapter click retains chapter filter');
              ck(window.scrollY>500 && top>=35 && top<160,'chapter row scrolls into view');
              ck(window.location.hash.startsWith('#e-33-'),'chapter navigation creates deep link');
              const fold=selected.querySelector('.fold');
              fold.click();
              await wait(450);
              ck(block.getBoundingClientRect().top>35 && block.getBoundingClientRect().top<160,'expanding chapter also scrolls into view');
              const chapterItem=block.querySelector('.card');
              chapterItem.querySelector('.hide-item').click();
              ck(number()===19,'individual hide retained');
              block.querySelector('.hide-chapter').click();
              ck(selected.hidden===true && selected.getClientRects().length===0,'hidden chapter removed from sidebar');
              ck(TOC_SEC.get('33').hidden,'hidden chapter sublist stays hidden');
              ck(HIDDEN_SECTIONS.has('33'),'chapter hide persisted');
              ck(!block.offsetParent,'main chapter disappears');
              const stored=JSON.parse(localStorage.getItem('howtolivebetter:hidden-sections:v1')||'[]');
              ck(stored.includes('33'),'chapter storage persisted');
              const scrollBefore=window.scrollY;
              document.getElementById('hidden-nav').click();
              ck(document.getElementById('hidden-manage').classList.contains('open'),'drawer opens');
              ck(document.querySelector('#hidden-section-list .restore-section'),'chapter restore button in drawer');
              ck(document.body.classList.contains('filter-open'),'background scroll locked');
              ck(Math.abs(window.scrollY-scrollBefore)<120,'drawer open did not scroll page');
              const chapterRestore=document.querySelector('#hidden-section-list .restore-section');
              chapterRestore.click();
              ck(selected.hidden===false,'chapter restored to sidebar');
              ck(number()===total-1,'restoring chapter keeps individual hidden item');
              document.getElementById('hidden-close').click();
              ck(!document.getElementById('hidden-manage').classList.contains('open'),'drawer closes');
              document.getElementById('hidden-nav').click();
              document.querySelector('#hidden-list .restore-item').click();
              ck(number()===total,'individual restore keeps full content');
              document.getElementById('hidden-done').click();
              ck(!localStorage.getItem('howtolivebetter:hidden-sections:v1') ||
                 JSON.parse(localStorage.getItem('howtolivebetter:hidden-sections:v1')).length===0,'chapter state restored');
              document.documentElement.dataset.navigationQa=checks.every(x=>x[0])?'PASS':'FAIL';
              document.documentElement.dataset.navigationQaInfo=checks.filter(x=>!x[0]).map(x=>x[1]).join(';');
            }catch(err){
              document.documentElement.dataset.navigationQa='ERROR';
              document.documentElement.dataset.navigationQaInfo=String(err.stack||err);
            }
          });
          </script>
          """
          p.write_text(s.replace('</body>',qa+'</body>'))
          PY
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=35000 --window-size=1440,900 --dump-dom http://127.0.0.1:8765/ > /tmp/nav-qa.txt 2>/tmp/nav-stderr.txt
          grep -o 'data-navigation-qa="[^"]*"' /tmp/nav-qa.txt || true
          grep -o 'data-navigation-qa-info="[^"]*"' /tmp/nav-qa.txt || true
          grep -q 'data-navigation-qa="PASS"' /tmp/nav-qa.txt
          echo NAVIGATION_BROWSER_PASS
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=12000 --screenshot=/tmp/navigation-mobile.png http://127.0.0.1:8765/ >/tmp/mobile.log 2>&1
          echo NAV_MOBILE_IMAGE_BEGIN
          base64 -w0 /tmp/navigation-mobile.png
          echo
          echo NAV_MOBILE_IMAGE_END
