<!doctype html>

<style>
*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}
body{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;background:#fbfaf7;color:#252c29}
.card{position:relative;width:100%;height:100%;padding:50px 72px 42px}

.feature{padding:10px 16px;border:1px solid #e2e8e0;border-radius:6px;background:#fffefa;font-size:17px;color:#46594f}
.footer{position:absolute;left:72px;right:72px;bottom:39px;border-top:1px solid #e2e6df;padding-top:18px;
